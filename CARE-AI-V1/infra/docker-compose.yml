services:
  care-ai:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      CARE_AI_DB_PATH: /app/data/care_ai.db
      CARE_AI_SLM_MODE: ${CARE_AI_SLM_MODE:-rules}
      CARE_AI_OLLAMA_BASE_URL: ${CARE_AI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CARE_AI_SLM_MODEL: ${CARE_AI_SLM_MODEL:-qwen3.5:0.8b}
      CARE_AI_LLM_ENABLED: ${CARE_AI_LLM_ENABLED:-false}
      CARE_AI_LLM_BASE_URL: ${CARE_AI_LLM_BASE_URL:-https://api.openai.com/v1}
      CARE_AI_LLM_API_KEY: ${CARE_AI_LLM_API_KEY:-}
      CARE_AI_LLM_MODEL: ${CARE_AI_LLM_MODEL:-}
    volumes:
      - ../backend/data:/app/data
